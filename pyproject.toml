[build-system]
requires = [
  "scikit-build-core>=0.8.0",
  "cmake>=3.18",
  "pybind11>=2.10",
  "setuptools>=61.0",
  "wheel",
  "numpy"
]
build-backend = "scikit_build_core.build"

[project]
name = "lammpsParser"
version = "0.1.1"
description = "LAMMPS dump parser"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Jon", email = "jon.aronoff@utah.edu" }
]
license = { text = "MIT" }
keywords = ["lammps","parser","pybind11","numpy"]
dependencies = [
  "numpy"
]

[project.urls]
Homepage = "https://github.com/jaronoff14/lammpsParser"


[tool.setuptools.packages.find]
where = ["."]
include = ["src/lammpsParser"]

[tool.scikit-build]
wheel.packages = ["src/lammpsParser/"]
